# Installed to /etc/systemd/system/star-admin.service.d/50-tailscale.conf by
# install.sh, only on devices running star-lan-bridge's admin page.
#
# star-admin only accepts connections from private (LAN) addresses. This adds
# Tailscale's addresses, so the page works at http://<tailscale-address>. The
# firewall rule (pi-tailscale-firewall) accepts them only on tailscale0.
[Service]
IPAddressAllow=100.64.0.0/10 fd7a:115c:a1e0::/48
