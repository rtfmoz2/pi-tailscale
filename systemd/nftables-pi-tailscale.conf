# SPDX-License-Identifier: MIT
# Installed to /etc/systemd/system/nftables.service.d/50-pi-tailscale.conf by
# install.sh (harmless if nftables isn't installed).
#
# Before nftables loads /etc/nftables.conf (at boot, start or reload), rewrite
# /etc/nftables.d/tailscale-00.nft from the config as it is now, so the
# drop-in always matches the chains the config defines. If that fails, the
# old drop-in stays and nftables loads as usual ("-").
[Service]
# Debian runs nftables.service with ProtectSystem=full (/etc read-only); the
# drop-in directory is the one place it needs to write. "-": fine if missing.
ReadWritePaths=-/etc/nftables.d
ExecStartPre=-/usr/local/sbin/pi-tailscale-firewall refresh
# Starting nftables replaces every rule, including ones the add-on put in the
# running firewall (e.g. for iptables); have it check again straight away.
ExecStartPost=-/bin/systemctl --no-block try-restart pi-tailscale-firewall.service
# Reload: the same, then Debian's own reload command.
ExecReload=
ExecReload=-/usr/local/sbin/pi-tailscale-firewall refresh
ExecReload=/usr/sbin/nft -f /etc/nftables.conf
